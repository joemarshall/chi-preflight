# Camera-ready settings
anonymous: false          # true: no author info allowed; false: authors with ORCIDs required
bibliography_heading: References   # heading of the Word bibliography section (ACM uses "References")
bibliography_style: Bib_entry      # Word paragraph style for reference entries; null accepts any style
validate_dois: true             # resolve every DOI online via doi.org (needs network)
abstract_style: Abstract          # Word paragraph style of the abstract; null falls back to finding an Abstract heading
min_abstract_words: 10         # abstract must exist and have at least this many words; null/0 disables
max_abstract_words: 150        # null disables; applies to LaTeX and Word abstracts
max_words: 12000          # null disables the limit; applies to LaTeX and Word

latex:
  document_class: acmart
  required_options: [sigconf]
  forbidden_options: [anonymous, review, manuscript]

# Phrases that must not appear in any file (matched case- and whitespace-insensitively).
# Format: "text to find": "error message shown"
banned_text:
  "Insert your first CCS term here": "CCS concept placeholder still in file"
  "Insert comma delimited author-supplied keyword list": "Author keywords need to be added to file"
