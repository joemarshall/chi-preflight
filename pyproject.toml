[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chi-preflight"
version = "0.1.0"
authors = [
  {name = "Joe Marshall", email = "joe.marshall@nottingham.ac.uk"}
]
maintainers = [
  {name = "Joe Marshall", email = "joe.marshall@nottingham.ac.uk"}
]
description = "Preflight checks for ACM SIGCHI conferences of LaTeX sources, Word documents and PDFs"
requires-python = ">=3.9"
dependencies = ["PyPDF2", "python-docx", "PyYAML", "print-color", "python-doi","requests", "tqdm"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
chi-preflight = "chi_preflight.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chi_preflight = ["configs/*.yaml"]

